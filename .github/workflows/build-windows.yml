name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Прогнать тесты перед сборкой (медленнее)
        type: boolean
        default: false
  push:
    branches: [main, master]

# новый запуск отменяет предыдущий — не ждём в очереди за старой сборкой
concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msi:
    runs-on: windows-2022   # на нём уже стоит WiX 3 для jpackage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать установщик
        run: ./gradlew.bat :desktopApp:packageMsi --no-daemon
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: Vitazone-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

      # Тесты не задерживают установщик: он уже собран и выложен выше
      - name: Тесты (по запросу)
        if: ${{ inputs.run_tests }}
        run: ./gradlew.bat :shared:jvmTest --tests "*DebtStatusTest" --no-daemon
        shell: cmd
