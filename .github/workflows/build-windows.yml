name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  msi:
    runs-on: windows-2022   # на нём уже стоит WiX 3 для jpackage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test debt statuses
        id: tests
        continue-on-error: true   # установщик собирается в любом случае, итог проверяется ниже
        run: ./gradlew.bat :shared:jvmTest --tests "*DebtStatusTest" --no-daemon
        shell: cmd
      - run: ./gradlew.bat :desktopApp:packageMsi --no-daemon
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Vitazone-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: echo "DebtStatusTest failed - msi was still built, but check the test log" && exit 1
        shell: bash
